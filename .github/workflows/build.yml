name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.12']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      shell: bash
      run: |
        ls -la
        pyinstaller BiTTuRK_SunumAraci.spec --clean

    - name: Create Installer (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        choco install innosetup -y
        "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" setup_script.iss

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BiTTuRK_SunumAraci-Windows
        path: BiTTuRK_SunumAraci_Setup.exe

    - name: Upload artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BiTTuRK_SunumAraci-macOS
        path: dist/BiTTuRK_SunumAraci

    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BiTTuRK_SunumAraci-Linux
        path: dist/BiTTuRK_SunumAraci

name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.12']
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install Playwright Chromium
      run: |
        python -m playwright install chromium

    - name: Find Chromium Path and Update Spec
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          PLAYWRIGHT_HOME="/c/Users/runneradmin/AppData/Local/ms-playwright"
          if [ -d "$PLAYWRIGHT_HOME" ]; then
            echo "Found ms-playwright at: $PLAYWRIGHT_HOME"
            # Tüm klasörleri ekle
            sed -i "s|# PLAYWRIGHT_CHROMIUM_PATH|('$PLAYWRIGHT_HOME', 'ms-playwright') # PLAYWRIGHT_CHROMIUM_PATH|g" BiTTuRK_SunumAraci.spec
          fi
        elif [ "$RUNNER_OS" == "macOS" ]; then
          PLAYWRIGHT_HOME="$HOME/Library/Caches/ms-playwright"
          if [ -d "$PLAYWRIGHT_HOME" ]; then
            echo "Found ms-playwright at: $PLAYWRIGHT_HOME"
            sed -i '' "s|# PLAYWRIGHT_CHROMIUM_PATH|('$PLAYWRIGHT_HOME', 'ms-playwright') # PLAYWRIGHT_CHROMIUM_PATH|g" BiTTuRK_SunumAraci.spec
          fi
        else
          PLAYWRIGHT_HOME="$HOME/.cache/ms-playwright"
          if [ -d "$PLAYWRIGHT_HOME" ]; then
            echo "Found ms-playwright at: $PLAYWRIGHT_HOME"
            sed -i "s|# PLAYWRIGHT_CHROMIUM_PATH|('$PLAYWRIGHT_HOME', 'ms-playwright') # PLAYWRIGHT_CHROMIUM_PATH|g" BiTTuRK_SunumAraci.spec
          fi
        fi

    - name: Build with PyInstaller
      shell: bash
      run: |
        ls -la
        pyinstaller BiTTuRK_SunumAraci.spec --clean

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BiTTuRK_SunumAraci-Windows
        path: dist/BiTTuRK_SunumAraci.exe

    - name: Upload artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BiTTuRK_SunumAraci-macOS
        path: dist/BiTTuRK_SunumAraci

    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BiTTuRK_SunumAraci-Linux
        path: dist/BiTTuRK_SunumAraci
